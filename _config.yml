# Favicon
favicon: /favicon.ico

# SEO
keywords: 

# Site title separator
separator: '-'

# SNS config
sns:
  Enter: /landing

# Nav menu
menu:
  Home: /
  Code: https://github.com/chunqiuyiyu
  Email: mailto:chunqiuyiyu@outlook.com
  RSS: /atom.xml

# Security
encrypt: # hexo-blog-encrypt
  enable: true
  abstract: [redacted]
  message: 請輸入密碼.
  tags:
  - {name: Avian, password: xxxxxx}
  wrong_pass_message: 抱歉, 密碼錯誤.
  wrong_hash_message: 抱歉, 此文章不能被校驗.
  theme: default

# advanced markdown
markdown_it_plus:
    highlight: false
    html: true
    xhtmlOut: true
    breaks: true
    langPrefix:
    linkify: true
    typographer:
    quotes: “”‘’
    pre_class: highlight

toc:
  maxdepth: 3
  class: toc
  slugify: transliteration
  decodeEntities: false
  anchor:
    position: after
    symbol: '#'
    style: header-anchor
